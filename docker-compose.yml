services:
  ai-gateway:
    build:
      context: ./ai-gateway
    container_name: FastAPI_AI_Gateway
    ports:
      - "8000:8000"
    environment:
      WORKER_URLS: ""
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: React_Frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
